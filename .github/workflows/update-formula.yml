name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 0.1.0)"
        required: true
      darwin_x64_sha:
        description: "SHA256 for macOS x64"
        required: true
      darwin_arm64_sha:
        description: "SHA256 for macOS ARM64"
        required: true
      linux_x64_sha:
        description: "SHA256 for Linux x64"
        required: true
      linux_arm64_sha:
        description: "SHA256 for Linux ARM64"
        required: true

jobs:
  update:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.PUSH_TOKEN }}

      - name: Set variables from dispatch
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
            echo "darwin_x64=${{ github.event.client_payload.darwin_x64_sha }}" >> $GITHUB_OUTPUT
            echo "darwin_arm64=${{ github.event.client_payload.darwin_arm64_sha }}" >> $GITHUB_OUTPUT
            echo "linux_x64=${{ github.event.client_payload.linux_x64_sha }}" >> $GITHUB_OUTPUT
            echo "linux_arm64=${{ github.event.client_payload.linux_arm64_sha }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "darwin_x64=${{ github.event.inputs.darwin_x64_sha }}" >> $GITHUB_OUTPUT
            echo "darwin_arm64=${{ github.event.inputs.darwin_arm64_sha }}" >> $GITHUB_OUTPUT
            echo "linux_x64=${{ github.event.inputs.linux_x64_sha }}" >> $GITHUB_OUTPUT
            echo "linux_arm64=${{ github.event.inputs.linux_arm64_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Update formula
        run: |
          cat > Formula/keep.rb << EOF
          class Keep < Formula
            desc "Files from your terminal, kept forever"
            homepage "https://github.com/Stoffbergie/keep"
            version "${{ steps.vars.outputs.version }}"
            license "MIT"

            on_macos do
              on_intel do
                url "https://github.com/Stoffbergie/keep/releases/download/v#{version}/keep-x86_64-apple-darwin.tar.gz"
                sha256 "${{ steps.vars.outputs.darwin_x64 }}"
              end
              on_arm do
                url "https://github.com/Stoffbergie/keep/releases/download/v#{version}/keep-aarch64-apple-darwin.tar.gz"
                sha256 "${{ steps.vars.outputs.darwin_arm64 }}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/Stoffbergie/keep/releases/download/v#{version}/keep-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.vars.outputs.linux_x64 }}"
              end
              on_arm do
                url "https://github.com/Stoffbergie/keep/releases/download/v#{version}/keep-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${{ steps.vars.outputs.linux_arm64 }}"
              end
            end

            def install
              bin.install "keep"
            end

            test do
              assert_match "keep", shell_output("#{bin}/keep --version")
            end
          end
          EOF
          git rm -q --ignore-unmatch Formula/shrd.rb
          printf '{\n  "shrd": "keep"\n}\n' > formula_renames.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/keep.rb formula_renames.json
          git commit -m "Update keep to v${{ steps.vars.outputs.version }}" || echo "No changes to commit"
          git push
