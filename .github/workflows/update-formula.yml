name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to update (keep or beam)"
        required: true
        default: keep
      version:
        description: "Version (e.g., 0.1.0)"
        required: true
      darwin_x64_sha:
        description: "SHA256 for macOS x64"
        required: true
      darwin_arm64_sha:
        description: "SHA256 for macOS ARM64"
        required: true
      linux_x64_sha:
        description: "SHA256 for Linux x64"
        required: true
      linux_arm64_sha:
        description: "SHA256 for Linux ARM64"
        required: true

jobs:
  update:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set variables from dispatch
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "formula=${{ github.event.client_payload.formula || 'keep' }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.client_payload.version }}" >> $GITHUB_OUTPUT
            echo "darwin_x64=${{ github.event.client_payload.darwin_x64_sha }}" >> $GITHUB_OUTPUT
            echo "darwin_arm64=${{ github.event.client_payload.darwin_arm64_sha }}" >> $GITHUB_OUTPUT
            echo "linux_x64=${{ github.event.client_payload.linux_x64_sha }}" >> $GITHUB_OUTPUT
            echo "linux_arm64=${{ github.event.client_payload.linux_arm64_sha }}" >> $GITHUB_OUTPUT
          else
            echo "formula=${{ github.event.inputs.formula }}" >> $GITHUB_OUTPUT
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "darwin_x64=${{ github.event.inputs.darwin_x64_sha }}" >> $GITHUB_OUTPUT
            echo "darwin_arm64=${{ github.event.inputs.darwin_arm64_sha }}" >> $GITHUB_OUTPUT
            echo "linux_x64=${{ github.event.inputs.linux_x64_sha }}" >> $GITHUB_OUTPUT
            echo "linux_arm64=${{ github.event.inputs.linux_arm64_sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Update formula
        run: >-
          ./scripts/render-formula.sh
          "${{ steps.vars.outputs.formula }}"
          "${{ steps.vars.outputs.version }}"
          "${{ steps.vars.outputs.darwin_x64 }}"
          "${{ steps.vars.outputs.darwin_arm64 }}"
          "${{ steps.vars.outputs.linux_x64 }}"
          "${{ steps.vars.outputs.linux_arm64 }}"

      - name: Commit and push
        env:
          FORMULA: ${{ steps.vars.outputs.formula }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/$FORMULA.rb"
          git commit -m "Update $FORMULA to v${{ steps.vars.outputs.version }}" || echo "No changes to commit"
          git push
